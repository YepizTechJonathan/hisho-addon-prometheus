# Prometheus for Hisho (written by bin/install.sh; edit this file in the add-on, not the copy).
# Machines come from targets/fleet.json, which Core rewrites from Fleet.yaml (label: machine).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files: [rules.yml]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:@PORT@"]
        labels: {machine: prometheus}
  - job_name: node
    file_sd_configs:
      - files: [targets/*.json]
        refresh_interval: 1m
